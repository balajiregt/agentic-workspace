  workspace: "combined-agentic-workspace"
  api_framework: "isolated-restassured"
  ui_framework: "isolated-playwright"

runtime:
  app_port: 5173
  mockserver_port: 3333
  app_url: "http://127.0.0.1:5173"
  mockserver_url: "http://127.0.0.1:3333"

quality_gates:
  require_role_matrix_tests: true
  require_mockserver_owned_behavior: true
  require_api_framework_isolation: true
