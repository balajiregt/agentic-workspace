  key: "UI-ROLE-001"
  summary: "Validate role-aware Playwright automation with a mockserver-backed UI"
  description: "Adopt the role-aware Playwright and mockserver slice as isolated UI automation inside the agentic workspace."
  change_type: "test-framework"
  affected_flows:
    - "role-aware operations console"
  affected_roles:
    - "admin"
    - "viewer"
    - "vip"
  in_scope:
    - ui_tests
    - mockserver
    - demo_app
  out_of_scope:
