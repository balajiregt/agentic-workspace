name: agentic-workspace

services:
  graph-views:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile.graphs
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8766:8766"
      - "127.0.0.1:8767:8767"
    environment:
      PYTHONUNBUFFERED: "1"
      GRAPHIFY_BIN: "/usr/local/bin/graphify"
    command: ["python3", "tooling/scripts/serve_graph_views.py", "--host", "0.0.0.0"]
