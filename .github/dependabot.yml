version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories:
      - /
      - /projects/agent-dashboard
      - /qa-projects/ui-automation/role-aware-mockserver
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: maven
    directories:
      - /projects/microservices
      - /projects/microservices/xyz-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /tooling/scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
